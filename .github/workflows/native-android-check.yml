name: Native Android debug validation
on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/native-android-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu image includes a modern Android SDK and cmdline-tools.
      # Do not invoke android-actions/setup-android@v3: it tries to install
      # a removed package named 'tools' and fails before Gradle executes.
      - name: Inspect Android toolchain
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          command -v sdkmanager
          sdkmanager --version
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Run core unit tests and compile debug app
        working-directory: android-native
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: martial-arts-academy-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
