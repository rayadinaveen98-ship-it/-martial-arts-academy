name: A01 neutral portrait Android review
on:
  pull_request:
    paths:
      - 'android-native/**'
      - 'tools/android/review_portrait.py'
      - '.github/workflows/native-portrait-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build and test before starting the emulator
        run: gradle -p android-native :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Enable KVM for hardware acceleration
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Capture the actual Android portrait
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 400
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on -memory 2048 -cores 2
          script: python3 tools/android/review_portrait.py
      - name: Upload build and real-device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-neutral-portrait-android
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/qa/portrait/*
          if-no-files-found: error
          retention-days: 7