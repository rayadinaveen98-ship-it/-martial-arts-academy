name: Native Android emulator visual smoke (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      # This is intentionally manual: repeated software-only Linux emulator runs
      # trigger com.android.systemui ANR. Use on an accelerated runner or after
      # fixing emulator infrastructure; saved screenshots are NOT an automatic pass.
      - name: Emulator and candidate screen capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            gradle -p android-native :app:assembleDebug
            python3 tools/android/capture_native.py
      - name: Upload screenshots and diagnostics regardless of test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maa-native-emulator-evidence
          path: android-native/qa/screenshots/*
          if-no-files-found: warn
          retention-days: 7
