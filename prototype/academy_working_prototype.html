.studio-headline em{color:#ff5172;font-style:normal}
.studio-intro{font-size:13px;color:#b5c4d8;line-height:1.55;margin:0 0 16px}
.studio-step-progress{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;color:#c6d2e5;font-size:11px;font-weight:800;letter-spacing:.04em}
.studio-track{height:5px;background:#1d2b42;border-radius:10px;margin-bottom:15px;overflow:hidden}
.studio-track>div{height:100%;background:linear-gradient(90deg,#ff315d,#fe6f94);transition:width .22s}
.studio-media{border:1px solid #3c4566;border-radius:21px;background:linear-gradient(120deg,#161f35,#111421);overflow:hidden;box-shadow:0 15px 40px #0006;display:grid;grid-template-columns:37% 63%;min-height:200px;margin:14px 0}
.studio-media-art{position:relative;min-height:210px;overflow:hidden;background:#060910}
.studio-media-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 33%;opacity:.92}
.studio-artshade{position:absolute;inset:0;background:linear-gradient(90deg,transparent 54%,#111421 100%),linear-gradient(0deg,#080b14c4,transparent 50%)}
.studio-photo-tag{position:absolute;left:8px;bottom:9px;font-size:8px;font-weight:900;background:#090f1dcc;border:1px solid #7386b255;padding:5px 6px;border-radius:6px;color:#dce7ff;line-height:1.3}
.studio-media-copy{padding:19px 15px 15px 4px;display:flex;flex-direction:column;justify-content:center}
.studio-kicker{color:#ff6686;font-size:10px;font-weight:900;letter-spacing:.13em;line-height:1.4}
.studio-media-copy h3{font-size:20px;line-height:1.13;margin:8px 0 10px;letter-spacing:-.04em;color:#fff}
.studio-media-copy p{font-size:11px;line-height:1.55;color:#b6c3d7;margin:0}
.studio-media-status{display:flex;align-items:center;gap:6px;margin-top:13px;font-size:9px;color:#eebcc7;font-weight:800}
.studio-pulse{display:block;width:7px;height:7px;border:1px solid #f77a98;border-radius:50%;background:#ff345b;box-shadow:0 0 12px #ff345b88;flex:none}
.studio-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:5px;background:#101a2a;border:1px solid #31425e;border-radius:14px;margin:19px 0 15px}
.studio-tabs button{background:transparent;border:1px solid transparent;color:#aebed5;font-size:11px;font-weight:800;padding:12px 2px;border-radius:10px;min-width:0}
.studio-tabs button.active{background:linear-gradient(140deg,#6f1a33,#a61b42);box-shadow:0 0 12px #f72e543d;border-color:#e94b73;color:#fff}
.studio-study,.studio-review,.studio-release{border:1px solid rgba(156,181,215,.18);border-radius:19px;background:linear-gradient(150deg,#131d2e,#101420);padding:17px;margin-bottom:13px}
.studio-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:15px 0 16px}
.studio-map-step{border:1px solid #334257;border-radius:12px;background:#1a2437;color:#b3bed1;padding:12px 3px 10px;min-width:0;display:grid;gap:6px;text-align:center;min-height:64px;align-content:center}
.studio-map-step span{font-size:16px;font-weight:900}
.studio-map-step small{font-size:8px;letter-spacing:.025em;line-height:1.2;overflow-wrap:anywhere;font-weight:800}
.studio-map-step.visited:not(.active){border-color:#6688a9;color:#d6e4fc}
.studio-map-step.active{background:linear-gradient(150deg,#9e2347,#361329);border-color:#ff6688;box-shadow:0 0 17px #ff245e39;color:#fff}
.studio-lesson-card{padding:19px;background:linear-gradient(155deg,#20283b,#12192a);border:1px solid #4d587580;border-radius:16px;min-height:264px}
.studio-small-index{color:#ff819e;font-size:10px;font-weight:900;letter-spacing:.1em;margin-bottom:8px}
.studio-small-index span{color:#a8b6cc;letter-spacing:0;font-weight:600}
.studio-lesson-card h2,.studio-review h2,.studio-release h2{font-size:24px;font-weight:900;line-height:1.08;letter-spacing:-.045em;margin:0 0 11px;color:#fff}
.studio-lesson-card>p,.studio-review>p,.studio-release>p{color:#c4d1e5;font-size:13px;line-height:1.7;margin:0 0 16px}
.studio-why{display:flex;gap:12px;background:#101a2b;border-left:3px solid #4c92f7;border-radius:7px;padding:12px}
.studio-why-icon{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:950;color:#74b5ff;min-width:40px}
.studio-why div{display:grid;gap:4px}.studio-why b{font-size:12px;color:#e9f2ff}.studio-why span{font-size:11px;line-height:1.55;color:#aabed7}
.studio-reveal{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid #5d4a65;background:#30172e;color:#ffe4ec;margin-top:14px;padding:11px 13px;border-radius:9px;font-size:12px;font-weight:850}
.studio-reveal span{font-size:18px;color:#ff7191}.studio-takeaway{font-size:12px;padding:14px;border-radius:10px;border:1px solid #80465b;background:#351827;margin-top:8px;line-height:1.6;color:#fff}
.studio-step-controls{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:15px}
.studio-step-controls button{min-height:43px;border-radius:11px;padding:9px 14px;background:#283a58;border:1px solid #607d9f;color:#fff;font-size:12px;font-weight:850}
.studio-step-controls button:disabled{opacity:.42;cursor:not-allowed}
.studio-step-controls div{font-size:10px;text-align:center;color:#b9c7dc;font-weight:800}
.studio-orientation{display:flex;align-items:start;gap:8px;font-size:11px;line-height:1.5;color:#b5cfff;border-radius:11px;margin-top:14px;padding:11px 12px;background:#142544;border:1px solid #355d8c}
.studio-orientation svg{width:18px;height:18px;flex:none}
.studio-error-list{display:grid;gap:9px;margin-top:15px}
.studio-error-item{background:#151f30;border:1px solid #384963;border-radius:13px;overflow:hidden}
.studio-error-item>button{display:flex;align-items:center;gap:11px;width:100%;padding:15px 13px;background:transparent;border:0;color:#edf2ff;text-align:left;font-size:12px;font-weight:820}
.studio-error-item>button b{margin-left:auto;color:#ff6587;font-size:20px}
.studio-error-number{color:#ff6b8c;font-size:12px;font-weight:900}
.studio-error-answer{background:#1d2636;border-top:1px solid #36445d;padding:14px 15px}.studio-error-answer strong{font-size:11px;color:#a7d3ff}.studio-error-answer p{font-size:12px;line-height:1.6;color:#d8e0f1;margin:6px 0 12px}
.studio-gates{display:grid;gap:9px;margin:16px 0}.studio-gates div{display:grid;grid-template-columns:27px 1fr auto;align-items:center;gap:8px;padding:13px 10px;background:#1b2436;border:1px solid #38465a;border-radius:12px;color:#e7effd;font-size:11px}.studio-gates span{font-weight:950;color:#ff7392}.studio-gates b{font-size:9px;color:#e9a7ba;text-align:right}
.studio-release-note{font-size:11px;padding:11px;border-radius:10px;border:1px solid #593647;background:#281824;color:#ebc7d4;line-height:1.5}
.studio-notes{padding:16px;border-radius:18px;background:linear-gradient(150deg,#1a2030,#141725);border:1px solid #45506a;margin:15px 0 17px}.studio-notes label{display:block;font-size:13px;color:#fff;font-weight:800;margin:10px 0}.studio-notes textarea{box-sizing:border-box;resize:vertical;width:100%;min-height:83px;background:#0d1524;color:#eef4ff;border:1px solid #445473;border-radius:12px;padding:13px;font-size:13px;line-height:1.6;font-family:inherit}.studio-notes textarea:focus-visible{outline:2px solid #fb597c;outline-offset:2px}.studio-note-footer{display:flex;justify-content:space-between;gap:10px;color:#899bb9;font-size:10px;margin-top:10px}
.studio-gate-message{font-size:11px;line-height:1.55;color:#e3a7b7;margin:10px 0;padding:12px;border:1px solid #734055;background:#271823;border-radius:11px}
.studio-quiz-cta:disabled{opacity:.5;cursor:not-allowed;background:#314056;box-shadow:none}
@media(max-width:370px){.studio-media{grid-template-columns:35% 65%}.studio-media-copy h3{font-size:17px}.studio-media-copy{padding:12px 9px 12px 2px}.studio-tabs button{font-size:10px}.studio-lesson-card{padding:14px}.studio-map-step small{font-size:7px}.studio-notes{padding:12px}}
@media(prefers-reduced-motion:reduce){.studio-track>div,.studio-map-step{transition:none}}

 {id:'stance',title:'Stance & Guard',summary:'Balance, positioning and defensive awareness',kicker:'FOUNDATION 01',intro:'Your base is the starting point of movement. Understand why a balanced stance and a ready guard belong together before studying any punch.',points:[['A stable base','The lead and rear feet are offset rather than lined up. Spacing needs to feel balanced, not rigidly measured.'],['Guard has a purpose','Hands and elbows protect vulnerable areas while allowing a comfortable, relaxed position.'],['Balance before speed','A useful starting position supports controlled movement and a return to guard.']],mistakes:[['Feet too close or crossed','This can undermine balance and make controlled movement more difficult.'],['Hands lowered or elbows spread','Less protection and a less useful starting position.'],['Locked or overly tense posture','Excessive stiffness makes coordination harder.']],questions:[{q:'What is the main purpose of an offset, balanced boxing stance?',a:['To look wider in photographs','To support balance and movement','To make punches automatically stronger'],correct:1,why:'The stance establishes a balanced base for movement. Appearance or guaranteed punching power is not the point.'},{q:'What is one important role of the non-punching hand?',a:['Stay near the guard position','Swing backward for momentum','Hang by the waist'],correct:0,why:'The non-punching hand should help maintain defensive coverage instead of dropping away.'}]},

function renderStudioStudy(){const unit=STUDIO[LESSONS[lesson].id],rec=studyRecord(lesson),c=unit.chapters[studioStep],n=unit.chapters.length;return `<section class="studio-study" aria-label="Interactive concept study"><div class="studio-kicker">CONCEPT STUDY / ${String(studioStep+1).padStart(2,'0')} OF ${String(n).padStart(2,'0')}</div><div class="studio-map" role="group" aria-label="Choose a concept step">${unit.chapters.map((s,i)=>`<button data-studio-step="${i}" class="studio-map-step ${i===studioStep?'active':''} ${rec.visited.includes(i)?'visited':''}" aria-label="Study step ${i+1}: ${s.label}" aria-current="${i===studioStep?'step':'false'}"><span>${String(i+1).padStart(2,'0')}</span><small>${s.label}</small></button>`).join('')}</div><div class="studio-lesson-card"><div class="studio-small-index">${c.label} <span>· ${unit.topic}</span></div><h2>${c.title}</h2><p>${c.concept}</p><div class="studio-why"><span class="studio-why-icon">WHY</span><div><b>Why this matters</b><span>${c.why}</span></div></div><button class="studio-reveal" data-studio-reveal="1" aria-expanded="${studioReveal}">${studioReveal?'Hide learning takeaway':'Reveal the key takeaway'} <span>${studioReveal?'−':'+'}</span></button>${studioReveal?`<div class="studio-takeaway" role="status">${c.takeaway}</div>`:''}</div><div class="studio-step-controls"><button data-studio-dir="-1" ${studioStep===0?'disabled':''}>‹ Previous</button><div>${studyCount(lesson)} of ${n} explored</div><button data-studio-dir="1" ${studioStep===n-1?'disabled':''}>Next ›</button></div><div class="studio-orientation">${icon('info')} ${stanceOrientation()}</div></section>`;}
function renderStudioErrors(){const errors=STUDIO[LESSONS[lesson].id].errors;return `<section class="studio-review"><div class="studio-kicker">THINK THROUGH COMMON ERRORS</div><h2>Spot the idea, not a fake pose.</h2><p>Choose an issue to understand why it matters. These cards do not inspect your body or certify form.</p><div class="studio-error-list">${errors.map((e,i)=>`<div class="studio-error-item"><button data-studio-error="${i}" aria-expanded="${studioError===i}"><span class="studio-error-number">${String(i+1).padStart(2,'0')}</span><span>${e.title}</span><b>${studioError===i?'−':'+'}</b></button>${studioError===i?`<div class="studio-error-answer"><strong>Why it matters</strong><p>${e.why}</p><strong>Learning principle</strong><p>${e.principle}</p></div>`:''}</div>`).join('')}</div></section>`;}
function renderStudioNotes(){const note=studyRecord(lesson).note;return `<section class="studio-notes"><div class="studio-kicker">YOUR LEARNING NOTE</div><label for="studioNote">What would you like to revisit with a real instructor?</label><textarea id="studioNote" data-studio-note="1" maxlength="600" rows="3" placeholder="A question, a term, or something that needs clarification...">${escapeHtml(note)}</textarea><div class="studio-note-footer"><span>Saved on this device · never sent to a coach</span><span id="noteCount">${note.length} / 600</span></div></section>`;}
function renderStudioRelease(){return `<section class="studio-release"><div class="studio-kicker">INSTRUCTIONAL MEDIA GATE</div><h2>Not released yet.</h2><p>We will add front, profile and three-quarter demonstrations only after each source clip, stance orientation and movement has been reviewed by a qualified boxing coach.</p><div class="studio-gates"><div><span>01</span> One consistent A01 character <b>In production</b></div><div><span>02</span> Real trainer reference & rights <b>Pending</b></div><div><span>03</span> Motion + coach sign-off <b>Pending</b></div></div><div class="studio-release-note">No misleading play button, synthetic angle switching, pose score or unreviewed animation is available.</div></section>`;}

function defaults(){return {profile:null,done:{},answers:{},study:{},demoSessions:0,lastDemo:null,feedback:{}}}
function load(){try{const value=JSON.parse(localStorage.getItem(STORE)||'null');return value&&typeof value==='object'?{...defaults(),...value}:defaults()}catch{return defaults()}}
let data=load();let route='home';let lesson=0;let tab='study';let qindex=0;let chosen=null;let modal='';let toastText='';let sound=false;
const clock={phase:'idle',duration:45,left:45,round:1,totalRounds:2,rest:15,paused:false,lastTick:0,interval:null};
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch{}};
const lessonDone=(i)=>Boolean(data.done[LESSONS[i].id]);const unlocked=(i)=>i===0||lessonDone(i-1);
const doneCount=()=>LESSONS.filter((_,i)=>lessonDone(i)).length;
const nextLesson=()=>{for(let i=0;i<LESSONS.length;i++)if(!lessonDone(i))return i;return 2};
const progressPct=()=>Math.round((doneCount()/3)*100);
function go(dest,i){if(dest==='quiz'&&!studyReady(lesson)){notify('Explore all four concept steps before the knowledge check.');return;}if(typeof i==='number'){if(!unlocked(i)){notify('Finish the previous knowledge check first.');return;}lesson=i;qindex=0;chosen=null;tab='study';studioError=-1;viewStudioStep(lesson,studyRecord(lesson).current||0,false)}else if(dest==='lesson'){tab='study';studioError=-1;viewStudioStep(lesson,studyRecord(lesson).current||0,false)}route=dest;modal='';render(true)}
function notify(msg){toastText=msg;render(false);setTimeout(()=>{if(toastText===msg){toastText='';const t=document.getElementById('toast');if(t)t.remove()}},2600)}

ishing the previous concept':l.summary}</span></div><span class="tiny-arrow">›</span></button>`).join('')}</div><div class="stats-line"><div class="stat"><b>${progressPct()}%</b><small>Concept progress</small></div><div class="stat"><b>${data.demoSessions}</b><small>Timer demos completed</small></div></div><p class="footer-disclaimer">Illustrative concept images aren't verified martial-arts instruction. This product prototype does not replace an experienced coach.</p></main>`}

function renderLesson(){const l=LESSONS[lesson],unit=STUDIO[l.id],n=unit.chapters.length,explored=studyCount(lesson),ready=studyReady(lesson),checked=lessonDone(lesson);return `<main class="screen-enter">${renderBack('Skill Studio',`Lesson ${lesson+1} of 3 · Boxing Foundations`)}<div class="eyebrow">${l.kicker} · KNOWLEDGE BEFORE MOVEMENT</div><h1 class="studio-headline">${l.title}</h1><p class="studio-intro">${l.intro}</p><div class="studio-step-progress"><span>CONCEPTS EXPLORED</span><span>${explored} / ${n}</span></div><div class="studio-track"><div style="width:${Math.round(explored/n*100)}%"></div></div>${renderStudioMedia()}<div class="studio-tabs" role="tablist" aria-label="Skill Studio sections"><button role="tab" aria-selected="${tab==='study'}" class="${tab==='study'?'active':''}" data-tab="study">Study path</button><button role="tab" aria-selected="${tab==='mistakes'}" class="${tab==='mistakes'?'active':''}" data-tab="mistakes">Common errors</button><button role="tab" aria-selected="${tab==='media'}" class="${tab==='media'?'active':''}" data-tab="media">Media status</button></div>${tab==='mistakes'?renderStudioErrors():tab==='media'?renderStudioRelease():renderStudioStudy()}${renderStudioNotes()}<button class="cta studio-quiz-cta" data-go="quiz" ${ready?'':'disabled'}>${icon('check')} ${checked?'Review Knowledge Check':ready?'Start Knowledge Check':'Explore all four steps first'} ${icon('arrow')}</button>${!ready?`<div class="studio-gate-message">${icon('info')} You have explored ${explored} of ${n} concept steps. Visit the remaining step cards to unlock the knowledge check. Video demonstrations are not required to learn these concepts.</div>`:''}<div class="spacer12"></div><button class="cta ghost" data-go="timer">${icon('timer')} Explore Timer Demo</button><p class="footer-disclaimer">Concept material follows our documented England Boxing and Boxing Canada research drafts. No trainer animation, physical technique correction or coach sign-off is implied.</p></main>`}
function renderQuiz(){const l=LESSONS[lesson];const q=l.questions[qindex];const right=chosen===q.correct;return `<main class="screen-enter">${renderBack('Knowledge Check',`${l.title} · ${qindex+1} of ${l.questions.length}`)}<div class="progress-head"><span>CONCEPT COMPREHENSION</span><span>${qindex+1} / ${l.questions.length}</span></div><div class="progress-line"><div style="width:${Math.round((qindex/l.questions.length)*100)}%"></div></div><div class="spacer16"></div><section class="content-panel"><div class="eyebrow">THINK BEFORE YOU CHOOSE</div><div class="quiz-q">${q.q}</div>${q.a.map((a,i)=>`<button class="answer ${chosen===i?(right?'correct':'selected'):''}" data-answer="${i}" ${chosen!==null?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${a}</span></button>`).join('')}${chosen!==null?`<div class="feedback ${right?'success':''}"><b>${right?'Correct understanding':'Not quite yet'}</b><div style="margin-top:5px">${q.why}</div></div><div class="spacer16"></div><button class="cta" data-quiz-next="${right?'yes':'retry'}">${right?(qindex===l.questions.length-1?'Complete Knowledge Check':'Next Question'):'Try Again'} ${icon('arrow')}</button>`:''}</section><p class="footer-disclaimer">This check measures knowledge, not physical technique. A quiz cannot certify boxing skill.</p></main>`}
function renderTimer(){const running=clock.phase==='focus'||clock.phase==='rest',pct=running?Math.max(0,Math.min(100,(clock.left/(clock.phase==='rest'?clock.rest:clock.duration))*100)):clock.phase==='done'?100:0,seconds=Math.ceil(clock.left);return `<main class="screen-enter">${renderBack('Guided Timer','Interaction preview · no coaching footage')}<div class="eyebrow">TRAINING TOOL · NON-INSTRUCTIONAL DEMO</div><h1 style="font-size:34px">FOCUS <em>SESSION</em></h1><div class="notice alert">${icon('info')} The timer is functional, but it does not prescribe exercise or demonstrate correct form. You can test it while seated. Physical drills remain pending expert review.</div><div class="circle-panel"><div class="circle-border" style="--pct:${pct}%"><div class="circle-inside"><div class="round-label">${clock.phase==='idle'?'READY TO START':clock.phase==='done'?'SESSION FINISHED':clock.phase==='rest'?'SHORT REST':`ROUND ${clock.round} OF ${clock.totalRounds}`}</div><div class="timer-text" id="timerDigits">${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}</div><div class="timer-state" id="timerState">${clock.phase==='idle'?'TIMER DEMO':clock.phase==='done'?'COMPLETE':clock.paused?'PAUSED':clock.phase==='rest'?'REST':'FOCUS'}</div></div></div></div><div class="section-head" style="margin-top:4px"><h2>Session duration</h2><span class="hint">Per focus round</span></div><div class="timer-options">${[30,45,60].map(n=>`<button class="pill-option ${clock.duration===n?'active':''}" data-duration="${n}" ${clock.phase!=='idle'?'disabled':''}>${n} seconds</button>`).join('')}</div><div class="timer-actions">${clock.phase==='idle'?`<button class="cta" data-timer="start">${icon('play')} Start Timer</button>`:clock.phase==='done'?`<button class="cta" data-timer="reset">${icon('reset')} New Session</button>`:`<button class="cta" data-timer="${clock.paused?'resume':'pause'}">${icon(clock.paused?'play':'pause')} ${clock.paused?'Resume':'Pause'}</button><button class="cta subtle" data-timer="stop">End</button>`}</div><div class="coach-note"><span class="note-icon">${icon('info')}</span><div><b>${clock.phase==='done'?'Timer session completed':clock.phase==='rest'?'Rest and check how you feel':'Purpose of this tool'}</b><span>${clock.phase==='done'?'A timer demonstration was saved. This does not measure technique or verified training.':clock.phase==='rest'?'You may pause or stop at any moment.':`Two focus intervals with one short break. You can pause, stop, and choose a duration. No speed, power or calorie scoring.`}</span></div></div><button class="toggle" data-toggle-audio="true"><span>${icon(sound?'volume':'mute')} &nbsp; Audio transition cue</span><span class="switch ${sound?'on':''}" aria-label="Audio ${sound?'on':'off'}"></span></button><p class="footer-disclaimer">If you choose to move physically, use a clear, non-slip area and stop if uncomfortable. This timer is not a physical training prescription.</p></main>`}
function renderJourney(){return `<main class="screen-enter">${renderBack('Your Journey','Real learning state, not skill certification')}<div class="eyebrow">KEEP YOUR PROGRESS HONEST</div><h1 style="font-size:35px">THE <em>JOURNEY</em></h1><div class="stats-line" style="margin:17px 0"><div class="stat"><b>${doneCount()} / 3</b><small>Concept checks</small></div><div class="stat"><b>${data.demoSessions}</b><small>Timer demos</small></div></div><div class="progress-head"><span>FOUNDATIONS COURSE</span><b>${progressPct()}%</b></div><div class="progress-line"><div style="width:${progressPct()}%"></div></div><div class="section-head"><h2>Course chapters</h2></div>${LESSONS.map((l,i)=>`<button class="path-item ${lessonDone(i)?'done':!unlocked(i)?'locked':'active'}" data-go="lesson" data-index="${i}" style="margin-bottom:9px"><div class="step-number">${lessonDone(i)?icon('check'):unlocked(i)?i+1:icon('lock')}</div><div class="path-text"><strong>${l.title}</strong><span>${lessonDone(i)?'Concept understood · tap to review':unlocked(i)?'Ready to study':'Prerequisite knowledge check pending'}</span></div>${icon('arrow')}</button>`).join('')}<div class="spacer12"></div><div class="notice">${icon('shield')} Your progress reports comprehension and timer usage only. It never implies a coach has confirmed your movement quality.</div>${data.lastDemo?`<div class="spacer16"></div><div class="metric-card"><p>Last timer demonstration</p><b style="font-size:14px">${new Date(data.lastDemo).toLocaleDateString()}</b></div>`:''}</main>`}
function renderSettings(){return `<main class="screen-enter">${renderBack('Settings','Profile and prototype controls')}<h1 style="font-size:35px">YOUR <em>PROFILE</em></h1><div class="content-panel"><div class="small-label">PERSONALIZATION</div><h3 style="margin-top:10px">Your starting point</h3><p>Goal: <b>${data.profile?.goal||'Not chosen'}</b></p><p>Stance preference: <b>${data.profile?.stance||'Not chosen'}</b></p><p>Available space: <b>${data.profile?.space||'Not chosen'}</b></p><button class="cta subtle" data-modal="profile">Edit preferences</button></div><div class="spacer16"></div><div class="notice">This prototype stores preferences and progress locally in this browser, with no sign-in or analytics collection.</div><div class="spacer16"></div><button class="cta ghost" data-modal="reset">${icon('reset')} Reset all local prototype data</button><p class="footer-disclaimer">Research draft · no qualified-coach motion sign-off · no physical mastery assessment · no paid services.</p></main>`}
function renderModal(){if(!modal)return'';if(modal==='reset')return `<div class="modal-overlay"><section class="modal"><button class="close-modal" data-close="1" aria-label="Close">×</button><div class="eyebrow">RESET PROTOTYPE</div><h2>Start <em>fresh?</em></h2><p>This removes your preferences, knowledge-check history and completed timer demo count from this browser.</p><button class="cta" data-reset="yes">Reset local progress</button><div class="spacer12"></div><button class="cta ghost" data-close="1">Cancel</button></section></div>`;if(modal==='stop')return `<div class="modal-overlay"><section class="modal"><button class="close-modal" data-close="1" aria-label="Close">×</button><div class="eyebrow">END SESSION</div><h2>End this <em>timer?</em></h2><p>An unfinished timer session will not be recorded as complete.</p><button class="cta" data-timer="confirmStop">End without saving</button><div class="spacer12"></div><button class="cta ghost" data-close="1">Keep session</button></section></div>`;if(modal==='profile'||modal==='welcome'){const p=data.profile||{goal:'Learn the basics',stance:'Unsure',space:'Not sure'};return `<div class="modal-overlay"><section class="modal"><button class="close-modal" data-close="1" aria-label="Close" style="${modal==='welcome'?'display:none':''}">×</button><div class="eyebrow">${modal==='welcome'?'WELCOME TO THE ACADEMY':'EDIT PREFERENCES'}</div><h2>YOUR JOURNEY.<br><em>YOUR PACE.</em></h2><p>${modal==='welcome'?'Three focused concepts. Real understanding. No rushed or unverified fight tutorials.':'These choices change your profile, not your assessed skill.'}</p><div class="fieldname">MY PRIMARY GOAL</div><div class="option-grid">${['Learn the basics','Build coordination','Explore boxing'].map(s=>`<button data-pick="goal" data-value="${s}" class="${p.goal===s?'chosen':''}">${s}</button>`).join('')}</div><div class="fieldname">STANCE ORIENTATION</div><div class="option-grid">${['Unsure','Orthodox','Southpaw'].map(s=>`<button data-pick="stance" data-value="${s}" class="${p.stance===s?'chosen':''}">${s}</button>`).join('')}</div><div class="fieldname">FREE MOVEMENT SPACE</div><div class="option-grid">${['Clear space','Limited space','Not sure'].map(s=>`<button data-pick="space" data-value="${s}" class="${p.space===s?'chosen':''}">${s}</button>`).join('')}</div><div class="notice" style="margin:16px 0">Choosing a stance does not validate your technique. Switching stance does not magically provide mirrored instruction footage.</div><button class="cta" data-save-profile="yes">${modal==='welcome'?'Enter the Academy':'Save preferences'} ${icon('arrow')}</button></section></div>`}return''}
function render(scroll){const root=document.getElementById('app');const content=route==='home'?renderHome():route==='lesson'?renderLesson():route==='quiz'?renderQuiz():route==='timer'?renderTimer():route==='journey'?renderJourney():renderSettings();root.innerHTML=`<div class="app-shell"><div class="ambient"></div>${renderHeader()}${content}<div class="end-spacer"></div></div>${renderNav()}${renderModal()}${toastText?`<div id="toast" role="status" class="toast">${toastText}</div>`:''}`;if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function completeCheck(){const l=LESSONS[lesson];data.done[l.id]={completedAt:new Date().toISOString(),questions:l.questions.length};save();if(doneCount()===3)notify('All three concept checks complete.');else notify('Concept check completed. The next lesson is now available.');go('journey')}
function resetTimer(){clock.phase='idle';clock.left=clock.duration;clock.round=1;clock.paused=false;clock.lastTick=0;if(clock.interval){clearInterval(clock.interval);clock.interval=null}}
function beep(){if(!sound)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=660;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.14);setTimeout(()=>c.close(),350)}catch{}}
function startTimer(){resetTimer();clock.phase='focus';clock.lastTick=performance.now();clock.interval=setInterval(tick,150);render(false)}
function tick(){if(clock.paused)return;const now=performance.now();clock.left-=(now-clock.lastTick)/1000;clock.lastTick=now;if(clock.left<=0){if(clock.phase==='focus'&&clock.round<clock.totalRounds){clock.phase='rest';clock.left=clock.rest;beep();render(false)}else if(clock.phase==='rest'){clock.round++;clock.phase='focus';clock.left=clock.duration;beep();render(false)}else{clock.phase='done';clock.left=0;clearInterval(clock.interval);clock.interval=null;data.demoSessions++;data.lastDemo=new Date().toISOString();save();beep();render(false)}}const el=document.getElementById('timerDigits');if(el){const s=Math.max(0,Math.ceil(clock.left));el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}}
function pickProfile(key,value){data.profile=data.profile||{goal:'Learn the basics',stance:'Unsure',space:'Not sure'};data.profile[key]=value;save();render(false)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.close){if(modal==='stop'&&!clock.paused&&clock.phase!=='idle'){clock.paused=false;clock.lastTick=performance.now()}modal='';render(false);return}
 if(b.dataset.modal){modal=b.dataset.modal;if(modal==='stop'&&clock.phase!=='idle'){clock.paused=true}render(false);return}
 if(b.dataset.pick){pickProfile(b.dataset.pick,b.dataset.value);return}
 if(b.dataset.saveProfile){modal='';save();render(false);return}
 if(b.dataset.reset){resetTimer();data=defaults();save();route='home';modal='welcome';render(true);return}
 if(b.dataset.go){let dest=b.dataset.go;let i=b.dataset.index!==undefined?Number(b.dataset.index):undefined;if(dest==='lesson'&&i===undefined)i=nextLesson();go(dest,i);return}
 if(b.dataset.studioStep!==undefined){viewStudioStep(lesson,Number(b.dataset.studioStep));return}
 if(b.dataset.studioDir!==undefined){viewStudioStep(lesson,studioStep+Number(b.dataset.studioDir));return}
 if(b.dataset.studioReveal!==undefined){studioReveal=!studioReveal;render(false);return}
 if(b.dataset.studioError!==undefined){const n=Number(b.dataset.studioError);studioError=studioError===n?-1:n;render(false);return}
 if(b.dataset.tab){tab=b.dataset.tab;studioError=-1;render(false);return}
 if(b.dataset.answer!==undefined){if(chosen===null){chosen=Number(b.dataset.answer);render(false)}return}
 if(b.dataset.quizNext){if(b.dataset.quizNext==='retry'){chosen=null;render(false)}else if(qindex<LESSONS[lesson].questions.length-1){qindex++;chosen=null;render(true)}else completeCheck();return}
 if(b.dataset.duration){clock.duration=Number(b.dataset.duration);clock.left=clock.duration;render(false);return}
 if(b.dataset.toggleAudio){sound=!sound;render(false);if(sound)beep();return}
 if(b.dataset.timer){switch(b.dataset.timer){case'start':startTimer();break;case'pause':clock.paused=true;render(false);break;case'resume':clock.paused=false;clock.lastTick=performance.now();render(false);break;case'stop':clock.paused=true;modal='stop';render(false);break;case'confirmStop':resetTimer();modal='';render(false);break;case'reset':resetTimer();render(false);break}return}
});
document.addEventListener('input',e=>{if(e.target&&e.target.dataset&&e.target.dataset.studioNote!==undefined){const note=String(e.target.value).slice(0,600);studyRecord(lesson).note=note;save();const count=document.getElementById('noteCount');if(count)count.textContent=note.length+' / 600';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&clock.interval&&clock.phase!=='done'){clock.paused=true;render(false)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&modal!=='welcome'){modal='';render(false)}});
window.__academyQA={state:()=>JSON.parse(JSON.stringify({data,route,lesson,tab,studioStep,studioReveal,studioError,clock:{phase:clock.phase,left:clock.left,paused:clock.paused,round:clock.round}})),navigate:go,visitStep:(n)=>viewStudioStep(lesson,n),studioReady:()=>studyReady(lesson),reset:()=>{resetTimer();data=defaults();save();route='home';render(true)},markDone:i=>{data.done[LESSONS[i].id]={completedAt:new Date().toISOString()};save();render(false)},forceTimerDone:()=>{clock.phase='focus';clock.round=clock.totalRounds;clock.left=.05;clock.lastTick=performance.now()-150;tick()}};
if(!data.profile){modal='welcome';}resetTimer();render(true);
})();

  </script>
